[project]
name = "nyc-crime-pipeline"
version = "1.0.0"
description = "ETL pipeline and interactive dashboard for NYC crime data analysis"
requires-python = ">=3.11"
dependencies = [
    # Data processing
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",

    # HTTP & API
    "httpx>=0.27.0",
    "tenacity>=8.2.0",

    # Visualization & Dashboard
    "streamlit>=1.36.0",
    "plotly>=5.20.0",
    "folium>=0.16.0",
    "streamlit-folium>=0.20.0",
    "pydeck>=0.9.0",

    # Machine Learning
    "scikit-learn>=1.4.0",
    "mlxtend>=0.23.0",

    # Logging
    "structlog>=24.1.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
nyc-pipeline = "src.pipeline:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
